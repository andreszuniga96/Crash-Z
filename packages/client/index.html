<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="ZombieRun Crash — El juego de crash multijugador con zombis. Provably Fair, tiempo real, adrenalina pura. Apuesta en pesos colombianos (COP)." />
    <meta name="theme-color" content="#000208" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZombieRun" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:title"       content="ZombieRun Crash" />
    <meta property="og:description" content="Sobrevive a la horda. Retira antes del colapso. Juego crash multijugador en tiempo real." />
    <meta property="og:type"        content="website" />
    <meta property="og:image"       content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="ZombieRun Crash" />
    <meta name="twitter:description" content="Sobrevive a la horda. Retira antes del colapso." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>ZombieRun Crash — Juega, Apuesta, Sobrevive</title>

    <style>
      /* Critical path CSS — prevents FOUC on canvas load */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root {
        width: 100%; height: 100%; overflow: hidden;
        background: #000208;
        font-family: 'Outfit', sans-serif;
      }
      #loading-screen {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #000208; color: #fff; z-index: 9999;
        gap: 1.5rem;
      }
      #loading-screen h1 {
        font-size: 2.5rem; font-weight: 900;
        background: linear-gradient(135deg, #ff3333 0%, #ff6600 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        letter-spacing: 0.05em;
      }
      #loading-screen p {
        color: #666; font-size: 0.9rem; font-family: 'JetBrains Mono', monospace;
      }
      .loading-bar {
        width: 220px; height: 3px; background: #111;
        border-radius: 2px; overflow: hidden;
      }
      .loading-bar-fill {
        height: 100%; background: linear-gradient(90deg, #ff3333, #ff6600);
        animation: loadPulse 1.2s ease-in-out infinite alternate;
      }
      @keyframes loadPulse { from { width: 20%; } to { width: 100%; } }
    </style>
  </head>
  <body>
    <!-- Loading screen shown before React mounts -->
    <div id="loading-screen">
      <h1>☣ ZOMBIERUN</h1>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
      <p>Initialising renderer…</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
