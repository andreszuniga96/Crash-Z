# ══════════════════════════════════════════════════════════════════════════════
#  ZombieRun Crash — Docker Compose (Production)
#
#  Services:
#    mongo   — MongoDB 7 with auth and oplog replica set for transactions
#    redis   — Redis 7 with AOF persistence + memory policy
#    server  — Node.js API + Socket.IO + GameStateMachine
#    client  — Nginx serving the Vite production build
#    nginx   — Reverse proxy: TLS termination, WebSocket upgrade, rate limiting
#
#  Usage:
#    cp .env.example .env && nano .env      # fill in secrets
#    docker compose build
#    docker compose up -d
#    docker compose logs -f server          # tail server logs
#
#  MongoDB bootstrap is fully automatic. The one-shot `mongo-init` container
#  runs on every `up` and is idempotent; it:
#    1. waits for mongod to accept authenticated connections
#    2. initiates the single-node replica set (required for transactions)
#    3. waits for a writable PRIMARY (rs.initiate returns before the election)
#    4. provisions the app user + unique indexes from your .env
#
#  `server` is gated on it with `condition: service_completed_successfully`,
#  so the API can never race ahead of a ready database.
#
#  Troubleshooting:
#    docker compose logs mongo-init    # bootstrap output
#    docker compose logs server        # app startup
# ══════════════════════════════════════════════════════════════════════════════

x-restart-policy: &restart-policy
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# ── Networks ────────────────────────────────────────────────────────────────────

networks:
  backend:
    internal: true # No direct external access to DB/Redis
  frontend:
    driver: bridge

# ── Volumes ─────────────────────────────────────────────────────────────────────

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

# ── Services ────────────────────────────────────────────────────────────────────

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    <<: [ *restart-policy, *default-logging ]
    # MongoDB requires a keyFile when both --auth and --replSet are active.
    # We copy the mounted keyfile to /tmp and set permissions 400 in bash.
    entrypoint:
      - bash
      - -c
      - |
        cp /etc/mongo/keyfile /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        chown 999:999 /tmp/mongo-keyfile
        exec docker-entrypoint.sh mongod \
          --replSet rs0 \
          --bind_ip_all \
          --auth \
          --keyFile /tmp/mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: zombierun
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/keyfile:/etc/mongo/keyfile:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          mongosh \
            --username "$$MONGO_INITDB_ROOT_USERNAME" \
            --password "$$MONGO_INITDB_ROOT_PASSWORD" \
            --authenticationDatabase admin \
            --quiet --eval "db.adminCommand('ping')"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    expose:
      - "27017"

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    <<: [ *restart-policy, *default-logging ]
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1000
    volumes:
      - redis_data:/data
    networks:
      - backend
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MongoDB Bootstrap (one-shot, idempotent) ────────────────────────────────
  #
  #  Gates `server` via service_completed_successfully. Everything it does is
  #  safely repeatable, so it runs on every `up` rather than once per volume.
  #  This is what makes the stack self-healing: a stale volume, a changed
  #  password in .env, or a wiped replica-set config are all reconciled here.
  #
  #  The script lives in docker/mongo/bootstrap.{sh,js} — a mounted script is
  #  used instead of an inline command so that shell/JS quoting never has to
  #  survive YAML + Compose interpolation on the way in.
  mongo-init:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Consumed by bootstrap.sh / bootstrap.js
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_RS_NAME: ${MONGO_RS_NAME:-rs0}
      MONGO_RS_HOST: ${MONGO_RS_HOST:-mongo:27017}
      MONGO_APP_USER: ${MONGO_APP_USER:-zombierun}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      MONGO_APP_DB: ${MONGO_APP_DB:-zombierun}
      BOOTSTRAP_WAIT_ATTEMPTS: "60"
    command: ["bash", "/bootstrap.sh"]
    volumes:
      - ./docker/mongo/bootstrap.sh:/bootstrap.sh:ro
      - ./docker/mongo/bootstrap.js:/bootstrap.js:ro
    networks:
      - backend
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }


  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
      args:
        NODE_ENV: production
    <<: [ *restart-policy, *default-logging ]
    environment:
      NODE_ENV: production
      PORT: 3001
      # replicaSet (not directConnection) is required: with a direct/single
      # connection the driver reports a Single topology and MongoDB rejects
      # transactions — which the game state machine depends on for atomic
      # balance updates.
      MONGODB_URI: mongodb://${MONGO_APP_USER:-zombierun}:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}@mongo:27017/${MONGO_APP_DB:-zombierun}?authSource=${MONGO_APP_DB:-zombierun}&replicaSet=${MONGO_RS_NAME:-rs0}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yourdomain.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 150
      # Round pacing. These MUST be listed here: compose only forwards the
      # variables named in this block (there is no env_file for this service),
      # so before this they were silently ignored and the compiled-in defaults
      # ruled — editing .env looked like it did nothing.
      BETTING_PHASE_MS: ${BETTING_PHASE_MS:-7000}
      INTER_ROUND_DELAY_MS: ${INTER_ROUND_DELAY_MS:-5000}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend
    expose:
      - "3001"
    # Graceful shutdown — allows in-flight rounds to complete
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Client (Nginx serving Vite build) ───────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    <<: [ *restart-policy, *default-logging ]
    networks:
      - frontend
    expose:
      - "80"
    depends_on:
      - server

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    <<: [ *restart-policy, *default-logging ]
    ports:
      - "80:80"
      # 443 requires TLS certs in docker/nginx/certs/ — uncomment when ready:
      # - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./docker/nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_started
    networks:
      - frontend
