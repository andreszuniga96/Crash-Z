worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    # ── Rate Limiting zones ───────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api:10m     rate=100r/m;
    limit_req_zone  $binary_remote_addr zone=auth:10m    rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # ── Upstream Services ─────────────────────────────────────────────────────
    upstream api_server {
        server server:3001;
        keepalive 32;
    }

    upstream client_app {
        server client:80;
    }

    # ══════════════════════════════════════════════════════════════════════════
    #  HTTP server — handles both HTTP-only (dev/staging) and HTTP→HTTPS redirect
    #
    #  To enable HTTPS:
    #    1. Place fullchain.pem + privkey.pem in docker/nginx/certs/
    #    2. Uncomment the "return 301" block below and the HTTPS server block
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        # ── Uncomment this block to force HTTPS redirect in production ────────
        # return 301 https://$host$request_uri;

        # ── API proxy ─────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://api_server;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Stricter rate limit for auth endpoints ────────────────────────────
        location ~ ^/api/auth/(login|register) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://api_server;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Socket.IO WebSocket upgrade ───────────────────────────────────────
        location /socket.io/ {
            limit_conn ws_conn 10;
            proxy_pass         http://api_server;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
        }

        # ── Health check (no logging) ─────────────────────────────────────────
        location /health {
            proxy_pass http://api_server;
            access_log off;
        }

        # ── Static client (SPA) ───────────────────────────────────────────────
        location / {
            proxy_pass         http://client_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    #  HTTPS server — uncomment and configure for production with TLS
    #  Requires certs at: docker/nginx/certs/fullchain.pem + privkey.pem
    # ══════════════════════════════════════════════════════════════════════════
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Frame-Options DENY always;
    #     add_header X-Content-Type-Options nosniff always;
    #
    #     location /api/       { ... same as HTTP block above ... }
    #     location /socket.io/ { ... same as HTTP block above ... }
    #     location /           { ... same as HTTP block above ... }
    # }
}
